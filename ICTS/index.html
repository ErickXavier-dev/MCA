<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Test Page</title>
  <script>
  async function checkInternetAndRedirect() {
      try {
          const controller = new AbortController();
          const timeout = setTimeout(() => controller.abort(), 3000); // 3 sec timeout
      
          const response = await fetch("https://www.gstatic.com/generate_204", {
              method: "GET",
              cache: "no-cache",
              signal: controller.signal
          });
        
          clearTimeout(timeout);
        
          // If response is OK → internet exists
          if (response.status === 204) {
              console.log("Internet OK");
          } else {
              throw new Error("No proper internet");
          }
        
      } catch (error) {
          console.log("No internet → redirecting");
      
          // Use redirect instead of popup (works in SEB)
          window.location.replace("https://www.gstatic.com/generate_204");
      }
  }
  
  // Run immediately when page loads
  checkInternetAndRedirect();
  </script>
</head>
<body>
  <h1>Just a Test Page</h1>
</body>
</html>
