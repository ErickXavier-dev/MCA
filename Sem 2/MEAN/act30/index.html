<!DOCTYPE html>
<html>
<head>
  <title>Registration Form</title>
  <script>
    function validateForm() {
      // Clear previous messages
      document.getElementById("nameError").innerHTML = "";
      document.getElementById("emailError").innerHTML = "";
      document.getElementById("passwordError").innerHTML = "";
      document.getElementById("confirmError").innerHTML = "";
      document.getElementById("success").innerHTML = "";
      var name = document.getElementById("name").value.trim();
      var email = document.getElementById("email").value.trim();
      var password = document.getElementById("password").value;
      var confirmPassword = document.getElementById("confirmPassword").value;
      var valid = true;
      // Name validation
      if (name === "") {
        document.getElementById("nameError").innerHTML = "Name is required.";
        valid = false;
      }
      // Email validation
      var emailPattern = /^[^ ]+@[^ ]+\.[a-z]{2,3}$/;
      if (email === "") {
        document.getElementById("emailError").innerHTML = "Email is required.";
        valid = false;
      } else if (!emailPattern.test(email)) {
        document.getElementById("emailError").innerHTML = "Enter valid email address.";
        valid = false;
      }
      // Password validation
      if (password === "") {
        document.getElementById("passwordError").innerHTML = "Password is required.";
        valid = false;
      } else if (password.length < 7) {
        document.getElementById("passwordError").innerHTML = "Password must be at least 7 characters.";
        valid = false;
      }
      // Confirm password
      if (confirmPassword === "") {
        document.getElementById("confirmError").innerHTML = "Confirm your password.";
        valid = false;
      } else if (password !== confirmPassword) {
        document.getElementById("confirmError").innerHTML = "Passwords do not match.";
        valid = false;
      }
      if (valid) {
        document.getElementById("success").innerHTML = "Registration Successful!";
      }
      return false; // prevent actual form submission
    }
  </script>
</head>
<body>
  <h2>Registration Form</h2>
  <form onsubmit="return validateForm()">
    <table cellpadding="5">
      <tr>
        <td>Name:</td>
        <td>
          <input type="text" id="name">
          <div id="nameError"></div>
        </td>
      </tr>
      <tr>
        <td>Email:</td>
        <td>
          <input type="text" id="email">
          <div id="emailError"></div>
        </td>
      </tr>
      <tr>
        <td>Password:</td>
        <td>
          <input type="password" id="password">
          <div id="passwordError"></div>
        </td>
      </tr>
      <tr>
        <td>Confirm Password:</td>
        <td>
          <input type="password" id="confirmPassword">
          <div id="confirmError"></div>
        </td>
      </tr>
      <tr>
        <td></td>
        <td>
          <input type="submit" value="Register">
        </td>
      </tr>
    </table>
  </form>
  <div id="success"></div>
</body>
</html>
