<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registration</title>
  <script>
    function validateForm() {
      const name = document.getElementById("name").value;
      const email = document.getElementById("email").value;
      const password = document.getElementById("password").value;

      if (!name || !email || (!password || password.length < 7)) {
        alert("Please fill in all fields and ensure the password is at least 7 characters long.");
        return false;
      }
      document.getElementById("status").textContent = "Registration successful!";
      return true;
    }
  </script>
</head>
<body>
  <form>
    <h1>Registration Form</h1>
    <label for="name">Name:</label>
    <input type="text" id="name" name="name" required><br><br>
    <label for="email">Email:</label>
    <input type="email" id="email" name="email" required><br><br>
    <label for="password">Password:</label>
    <input type="password" id="password" name="password" required><br><br>
    <input type="button" onclick="validateForm()" value="Register">
    <span id="status"></span>
  </form>
</body>
</html>
