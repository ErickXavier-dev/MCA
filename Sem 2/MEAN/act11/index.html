<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OnClick Magic</title>
  <script type="text/javascript">
    function showAlert() {
      alert("This is the first instruction");
      alert("This is the second instruction");
      alert("This is the third instruction");
    }
  </script>
</head>
<body>
  <h1>OnClick Magic</h1>
  <input type="button" name="alert" id="alert" value="Click Me!" onclick="showAlert()">
</body>
</html>
