<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registration form</title>
  <script>
    function validateForm(clickedButton) {
      var name = document.getElementById("name").value;
      var dob = document.getElementById("dob").value;
      var address = document.getElementById("address").value;
      var phone = document.getElementById("phone").value;
      var age = document.getElementById("age").value;

      if (!name || !dob || !address || !phone || !age) {
        alert("Please fill in all fields.");
        return false;
      }
      if (clickedButton === 1) {
        document.getElementById("status").textContent = "Registration successful!";
        document.getElementById("status").style.color = "green";
      }
      return true;
    }
    function checkEligibility() {
      if (!validateForm(0)) {
        return;
      }
      var age = parseInt(document.getElementById("age").value);
      var name = document.getElementById("name").value;
      if (age < 18) {
        document.getElementById("status").textContent = `${name} is not eligible to vote.`;
        document.getElementById("status").style.color = "red";
        return false;
      } else {
        document.getElementById("status").textContent = `${name} is eligible to vote.`;
        document.getElementById("status").style.color = "green";
        return true;
      }
    }
  </script>
</head>
<body>
  <h1 style="text-align: center;">Registration Form</h1>
  <form>
    <label for="name">Name:</label>
    <input type="text" id="name" name="name" required><br><br>
    <label for="dob">DOb:</label>
    <input type="date" id="dob" name="dob" required><br><br>
    <label for="address">Address:</label>
    <textarea id="address" name="address" required></textarea><br><br>
    <label for="phone">Phone:</label>
    <input type="text" id="phone" name="phone" required><br><br>
    <label for="age">Age: </label>
    <input type="text" id="age" name="age" required><br><br>
    <input type="button" value="Register" onclick="validateForm(1)"><br><br>
    <input type="button" value="Eligibility" onclick="checkEligibility()"><br><br>
    <span id="status"></span>
  </form>
</body>
</html>
