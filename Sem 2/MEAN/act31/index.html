<!DOCTYPE html>
<html>
<head>
    <title>Doctor Appointment Form</title>
</head>
<body bgcolor="#f2f2f2">

<center>
<h1>Doctor Appointment Form</h1>
<hr color="red" width="60%">
</center>

<table width="100%" cellpadding="20">
<tr>
  <td width="40%" align="center">
    <img src="https://hips.hearstapps.com/hmg-prod/images/portrait-of-a-happy-young-doctor-in-his-clinic-royalty-free-image-1661432441.jpg?crop=0.66698xw:1xh;center,top&resize=1800:*" width="350">
  </td>
  <td width="60%">
    <form>
      <table cellpadding="8">
        <tr>
          <td><b>Appointment Date</b></td>
          <td><input type="date"></td>
        </tr>
        <tr>
          <td><b>Appointment Time</b></td>
          <td><input type="time"></td>
        </tr>
        <tr>
          <td><b>Name</b></td>
          <td>
            <input type="text" placeholder="First">
            <input type="text" placeholder="Last">
          </td>
        </tr>
        <tr>
          <td><b>Gender</b></td>
          <td>
            Male <input type="radio" name="gender">
            Female <input type="radio" name="gender">
          </td>
        </tr>
        <tr>
          <td><b>Phone</b></td>
          <td><input type="text" placeholder="####"></td>
        </tr>
        <tr>
          <td><b>Address</b></td>
          <td>
            <input type="text" placeholder="city">
            <input type="text" placeholder="state">
          </td>
        </tr>
        <tr>
          <td valign="top"><b>Your Query</b></td>
          <td>
            <textarea rows="4" cols="40"></textarea>
          </td>
        </tr>
        <tr>
          <td valign="top"><b>Appointment Type</b></td>
          <td>
            <input type="checkbox"> Cervix checkup <br>
            <input type="checkbox"> Heart checkup <br>
            <input type="checkbox"> Eye check-up <br>
            <input type="checkbox"> Hearing Test
          </td>
        </tr>
        <tr>
          <td></td>
          <td>
            <input type="submit" value="Send">
          </td>
        </tr>
      </table>
    </form>
  </td>
</tr>
</table>
</body>
</html>
